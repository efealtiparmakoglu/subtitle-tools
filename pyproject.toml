[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "subtitle-tools"
version = "1.0.0"
description = "SRT/VTT toolkit: shift, convert, merge, detect overlaps — for subtitle fans. Zero dependencies."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
keywords = ["srt", "vtt", "subtitle", "fps", "cli"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Video",
]

[project.scripts]
subtitle-tools = "subtitle_tools.cli:main"

[tool.setuptools.packages.find]
include = ["subtitle_tools*"]
